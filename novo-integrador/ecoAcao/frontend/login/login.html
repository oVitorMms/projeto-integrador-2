<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login EcoAção</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <section>
        <div class="imagemFundo">
            <img src="../assets/forest-cartoon.webp" alt="Floresta de fundo" draggable="false">
        </div>
        <div class="main">
            <img class="logo" src="../assets/logo.png" alt="Logo EcoAção" draggable="false">
            <h1>Faça login na sua conta:</h1>
            <p>Use suas credenciais para fazer login</p>
            <div class="credenciais">
                <div class="email">
                    <input type="email" placeholder="EMAIL">
                </div>
                
                <div class="senha">
                    <input type="password" placeholder=" SENHA">
                </div>
                <button class="botaoLogin">Logar!</button>
            </div>
            <div class="areaRegistro">
                <p>Não tem conta ainda? <a href="#" id="linkRegistro">Registre-se</a></p>
            </div>
        </div>
    </section>
</body>
</html>
